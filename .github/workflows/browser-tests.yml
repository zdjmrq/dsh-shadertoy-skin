name: Browser regressions

on:
  workflow_call:

permissions:
  contents: read

jobs:
  browser:
    name: test (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [renderer, audio, panel, ui, audit, core, project, multi, worker, editor, surfaces, transparency, startup, playback]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install dev dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Browser regressions
        run: npm run test:${{ matrix.suite }}
        env:
          PLAYWRIGHT_CHANNEL: chrome
      - name: Preserve failed browser screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-failure-${{ matrix.suite }}
          # Only synthetic browser-harness screenshots, never profile state or
          # arbitrary scratch output. Hidden .tmp-validation needs explicit opt-in.
          path: |
            .tmp-validation/verify/**/*.png
            .tmp-validation/new-presets/*.png
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
