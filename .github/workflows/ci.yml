name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    name: bundle checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Syntax check (every tracked script)
        # Derive the list from git instead of maintaining one: new tools and
        # renderer modules used to be silently left out of this step.
        run: |
          git ls-files '*.js' '*.mjs' '*.cjs' | while IFS= read -r file; do
            node --check "$file"
          done
      - name: Bundle checks (manifest, files, licence hygiene, npm pack content)
        run: npm run check
      - name: Host half route tests
        run: npm run test:host
      - name: Project format tests
        run: node tools/project-format-test.mjs

  typecheck:
    name: typecheck (TypeScript 7, no emit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install dev dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: TypeScript type check (JSDoc, no build step)
        run: npm run typecheck

  suites:
    uses: ./.github/workflows/browser-tests.yml
