<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ShaderSkin Player</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #c { display: block; width: 100%; height: 100%; border: 0; background: transparent; }
  #err {
    position: fixed; inset: 0; margin: 0; padding: 18px 20px; overflow: auto;
    background: rgba(12, 15, 20, .94); color: #ffb4a8;
    font: 12px/1.6 ui-monospace, SFMono-Regular, Consolas, "Cascadia Mono", monospace;
    white-space: pre-wrap; display: none;
  }
  #err.open { display: block; }
  #err b { color: #ff7b6b; }
  #diag { display: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<pre id="err"></pre>
<pre id="diag"></pre>
<script type="module" src="./player-controller.js"></script>
</body>
</html>
