        const scrollLeft = area.scrollLeft
        area.focus({ preventScroll: true })
        area.scrollTop = scrollTop
        area.scrollLeft = scrollLeft
      })
      card.addEventListener('keydown', event => {
        if (event.key !== 'Tab' || !card.classList.contains('focused')) return
        const targets = [...card.querySelectorAll('button, textarea')].filter(node => !node.disabled && node.getClientRects().length)
        const first = targets[0]
        const last = targets.at(-1)
        if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus() }
        else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus() }
      })
    }
    const applyPreferences = () => {
      $('view-code').classList.toggle('wrap-code', wrap.checked)
      for (const id of ['code-image', 'code-sound']) {
        $(id).wrap = wrap.checked ? 'soft' : 'off'
        $(id).style.fontSize = `${size.value}px`
        $(`${id}-lines`).style.fontSize = `${size.value}px`
      }
      try { localStorage.setItem('shadertoy-skin.codeView', JSON.stringify({ wrap: wrap.checked, size: Number(size.value) })) } catch { /* optional preference */ }
    }
    try {
      const saved = JSON.parse(localStorage.getItem('shadertoy-skin.codeView') || 'null')
      if (saved) { wrap.checked = saved.wrap === true; if ([12, 14, 16, 18, 20].includes(saved.size)) size.value = String(saved.size) }
    } catch { /* default view */ }
    wrap.addEventListener('change', applyPreferences)
    size.addEventListener('change', applyPreferences)
    applyPreferences()
    document.addEventListener('keydown', event => { if (event.key === 'Escape' && document.body.classList.contains('editor-focus')) { event.preventDefault(); exitFocus() } })
    $('code-note').setAttribute('role', 'status')
  }

  // ---------------------------------------------------------------- messages
  if (!STANDALONE) {
    window.addEventListener('message', event => {
      if (event.origin !== location.origin || event.source !== parent) return
      const message = event.data
      if (!message || typeof message !== 'object') return
      if (message.type === 'audio') {
        audioState = typeof message.state === 'string' ? message.state : 'none'
        sync()
        if (audioState === 'error') {
          const text = `声音错误：${String(message.reason || '声音初始化失败').slice(0, 220)}`
          setNote(text, true)
          setCodeNote(text, true)
        }
      } else if (message.type === 'error') {
        const text = `渲染错误（${message.stage}）：${String(message.log ?? '').slice(0, 220)}`
        setNote(text, true)
        setCodeNote(text, true)
      } else if (message.type === 'theme') {
        applyTheme()
      } else if (message.type === 'preset') {
        if (typeof message.id === 'string' && message.id !== state.activeId) {
          state.activeId = message.id
          sync()
          renderLibrary()
          if (!$('view-code').hidden) void loadCode()
        }
      }
    })
  }

  // ---------------------------------------------------------------- boot
  async function boot() {
    applyTheme()
    watchParentTheme()
    if (STANDALONE) {
      document.documentElement.classList.add('standalone')
      document.body.classList.add('standalone')
    }
    try { defaults = await fetchJson('defaults.json') } catch { /* built-in defaults */ }
    try { manifest = await fetchJson(`${BASE}/presets/index.json`) } catch { manifest = [] }
    manifest = Array.isArray(manifest) ? manifest : []
    if (manifest.length === 0) manifest = [{ id: 'aurora', name: '极光（自写）' }, { id: 'flow', name: '流体色带（自写）' }]
    {
      try {
        const response = await fetch(`${BASE}/state`, { cache: 'no-store' })
        if (!response.ok) throw new Error('state unavailable')
        const remote = await response.json()
        if (!remote || typeof remote !== 'object' || (remote.entries !== undefined && !Array.isArray(remote.entries))) throw new Error('invalid state')
        if (remote.entries?.some(entry => !entry || typeof entry.id !== 'string' || typeof entry.code?.image !== 'string')) throw new Error('invalid entries')
        if (remote && typeof remote === 'object') {
          state.activeId = typeof remote.activeId === 'string' ? remote.activeId : null
          state.entries = Array.isArray(remote.entries) ? remote.entries : []
          if (remote.overrides && typeof remote.overrides === 'object') state.overrides = remote.overrides
          else if (remote.params && typeof remote.params === 'object' && state.activeId) state.overrides[state.activeId] = remote.params
        }
        stateEtag = response.headers.get('etag')
        stateLoaded = true
      } catch { stateLoaded = false }
    }
    if (!state.activeId) state.activeId = manifest[0]?.id ?? 'aurora'
    persistedActiveId = state.activeId
    arrangeSettings()
    bindParams()
    bindLibrary()
    bindCode()
    sync()
    renderLibrary()
    // Push the stored params once: the player/glass always mirror what this page
    // shows, and a page refresh is enough to re-sync after an edit elsewhere.
    if (!STANDALONE && stateLoaded) toParent({ type: 'params', params: effective() })
    if (!stateLoaded) setNote('配置读取失败，请重新加载。', true)
    if (MODE === 'main') {
      document.documentElement.classList.add('mode-main')
      document.body.classList.add('mode-main')
      panel.classList.add('open')
    } else if (STANDALONE) {
      setTab(query.get('tab') === 'library' ? 'library' : 'params')
      setOpen(true)
    } else {
      setOpen(false)
      toParent({ type: 'ready' })
    }
  }

  boot()
})()
</script>
</body>
</html>
